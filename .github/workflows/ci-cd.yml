name: CI/CD Pipeline

on:
  push:
    branches:
      - jdbc
  pull_request:
    types:
      - closed

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'  # 使用 JDK 21
          distribution: 'temurin'  # 推荐使用 Temurin 发行版

      - name: Run tests
        run: ./gradlew test  # 如果你使用 Maven，可以替换为 `mvn test`

      - name: Build JAR
        run: ./gradlew build  # 如果你使用 Maven，可以替换为 `mvn package`

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: build/libs/*.jar  # 如果你使用 Maven，路径可能是 `target/*.jar`